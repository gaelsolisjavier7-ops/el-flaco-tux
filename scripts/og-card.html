<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Tarjeta Open Graph - EL FLACO TUX</title>
<!--
  Plantilla de la tarjeta que se ve al compartir el sitio por WhatsApp.
  Se renderiza a 1200x630 con `npm run make:og` (no se abre en el navegador
  como página del sitio).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Fira+Code:wght@500;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #0D0F12;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .grid {
    position: absolute; inset: 0; z-index: 2;
    background-image:
      linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    mask-image: linear-gradient(90deg, #000 0 46%, transparent 66%);
    -webkit-mask-image: linear-gradient(90deg, #000 0 46%, transparent 66%);
  }
  .glow-yellow {
    position: absolute; width: 760px; height: 760px; left: -340px; top: -400px; z-index: 1;
    background: radial-gradient(circle, rgba(255,195,0,.24), rgba(255,195,0,0) 65%);
  }
  .topline {
    position: absolute; top: 0; left: 0; right: 0; height: 9px; z-index: 20;
    background: linear-gradient(90deg, #E63946 0 30%, #FFC300 30% 100%);
  }

  /* Foto a sangre completa con degradado a la izquierda: sin costuras */
  .photo { position: absolute; inset: 0; z-index: 0; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 74% 50%; }
  .photo::after {
    content: ''; position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(90deg,
        #0D0F12 0%,
        #0D0F12 30%,
        rgba(13,15,18,.97) 40%,
        rgba(13,15,18,.86) 50%,
        rgba(13,15,18,.55) 60%,
        rgba(13,15,18,.16) 71%,
        rgba(13,15,18,0) 80%),
      radial-gradient(ellipse at 74% 42%, rgba(13,15,18,0) 32%, rgba(13,15,18,.55) 100%),
      linear-gradient(0deg, rgba(13,15,18,.92) 0%, rgba(13,15,18,0) 34%),
      linear-gradient(180deg, rgba(13,15,18,.55) 0%, rgba(13,15,18,0) 22%);
  }

  .content { position: relative; z-index: 10; padding: 50px 0 0 66px; width: 660px; }

  .logo-tile {
    width: 108px; height: 108px; border-radius: 20px; overflow: hidden;
    background: #0B0D10;
    border: 1px solid rgba(255,255,255,.10);
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }
  .logo-tile img { width: 100%; height: 100%; display: block; }

  .title {
    font-family: 'Anton', 'Space Grotesk', sans-serif;
    font-size: 94px;
    line-height: .92;
    letter-spacing: .004em;
    color: #FFC300;
    text-transform: uppercase;
    margin-top: 24px;
    text-shadow: 0 6px 26px rgba(0,0,0,.55);
  }

  .subtitle {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
    line-height: 1.26;
    margin-top: 14px;
    color: #fff;
    text-shadow: 0 4px 18px rgba(0,0,0,.6);
  }
  .subtitle .amp { color: #E63946; }

  .row { display: flex; align-items: center; gap: 16px; margin-top: 26px; }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    font-family: 'Fira Code', monospace;
    font-size: 18px; font-weight: 700; letter-spacing: .05em;
    text-transform: uppercase;
    color: #FFC300;
    border: 1.5px solid rgba(255,195,0,.55);
    border-radius: 4px;
    padding: 11px 16px;
    background: rgba(255,195,0,.08);
  }
  .pill .caret { color: #E63946; }
  .chat {
    display: inline-flex; align-items: center; gap: 9px;
    font-family: 'Fira Code', monospace;
    font-size: 16px; font-weight: 500; letter-spacing: .02em;
    color: #25D366;
    text-shadow: 0 2px 10px rgba(0,0,0,.8);
  }
  .chat .dot { width: 9px; height: 9px; border-radius: 50%; background: #25D366; box-shadow: 0 0 12px rgba(37,211,102,.9); }

  .footer {
    position: absolute; left: 66px; bottom: 36px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    font-family: 'Fira Code', monospace;
    font-size: 14.5px; letter-spacing: .07em; text-transform: uppercase;
    color: rgba(255,255,255,.62);
    text-shadow: 0 2px 12px rgba(0,0,0,.9);
  }
  .footer .mark { width: 10px; height: 10px; background: #E63946; }
</style>
</head>
<body>
  <div class="photo">
    <img src="/assets/images/burger_bacon.jpg" alt="">
  </div>
  <div class="glow-yellow"></div>
  <div class="grid"></div>
  <div class="topline"></div>

  <div class="content">
    <div class="logo-tile"><img src="/assets/images/el_flaco_tux_logo.png" alt="Tux"></div>
    <div class="title">El Flaco Tux</div>
    <div class="subtitle">Hamburguesas, Alitas<br><span class="amp">&amp;</span> Botanas</div>
    <div class="row">
      <div class="pill"><span class="caret">&gt;</span> Root de tu antojo</div>
      <div class="chat"><span class="dot"></span> WhatsApp</div>
    </div>
  </div>

  <div class="footer"><span class="mark"></span> Nanchital, Veracruz · A la plancha, al momento</div>
</body>
</html>
