<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Dedos de Queso EL FLACO TUX</title>
  <desc id="d">Dedos de queso empanizados y dorados, uno partido con queso fundido, con salsa marinara.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#3A2410"/>
      <stop offset="55%" stop-color="#1A1210"/>
      <stop offset="100%" stop-color="#090909"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0%" stop-color="#FFC300" stop-opacity="0.3"/>
      <stop offset="55%" stop-color="#E63946" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6C073"/>
      <stop offset="45%" stop-color="#D9913A"/>
      <stop offset="100%" stop-color="#94501A"/>
    </linearGradient>
    <linearGradient id="stickGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFB160"/>
      <stop offset="48%" stop-color="#C87D2B"/>
      <stop offset="100%" stop-color="#7E3F10"/>
    </linearGradient>
    <linearGradient id="cheese" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="55%" stop-color="#FFC93C"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <linearGradient id="marinara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E24B3C"/>
      <stop offset="60%" stop-color="#C2201B"/>
      <stop offset="100%" stop-color="#8E1310"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#000000" flood-opacity="0.62"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <pattern id="paper" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#151515"/>
      <rect width="28" height="28" fill="#1D1D1D"/>
      <rect x="28" y="28" width="28" height="28" fill="#1D1D1D"/>
    </pattern>
    <g id="stick">
      <rect x="-150" y="-31" width="300" height="62" rx="30" fill="url(#stickGrad)" stroke="#5E2F0C" stroke-width="5"/>
      <rect x="-124" y="-20" width="212" height="15" rx="7" fill="#FFDC9E" opacity="0.4"/>
      <g fill="#FFE3B4" opacity="0.6">
        <circle cx="-84" cy="6" r="4"/>
        <circle cx="-34" cy="-10" r="3.2"/>
        <circle cx="18" cy="10" r="3.6"/>
        <circle cx="66" cy="-6" r="3"/>
        <circle cx="104" cy="8" r="3.4"/>
        <circle cx="-14" cy="16" r="2.6"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#paper)" opacity="0.26"/>
  <circle cx="400" cy="268" r="320" fill="url(#glow)"/>
  <ellipse cx="400" cy="512" rx="300" ry="44" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <!-- Plato -->
  <g filter="url(#shadow)">
    <ellipse cx="384" cy="318" rx="304" ry="192" fill="url(#plateGrad)" stroke="#353535" stroke-width="7"/>
    <ellipse cx="384" cy="314" rx="266" ry="160" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  </g>

  <!-- Dedos enteros -->
  <g filter="url(#shadow)">
    <use href="#stick" transform="translate(388 246) rotate(4) scale(0.9)"/>
    <use href="#stick" transform="translate(300 328) rotate(-12) scale(0.86)"/>
    <use href="#stick" transform="translate(478 344) rotate(16) scale(0.84)"/>
  </g>

  <!-- Dedo partido + queso estirado -->
  <g filter="url(#shadow)">
    <g transform="translate(320 442) rotate(-9) scale(0.76)">
      <rect x="-158" y="-31" width="176" height="62" rx="30" fill="url(#stickGrad2)" stroke="#5E2F0C" stroke-width="5"/>
      <ellipse cx="18" cy="0" rx="27" ry="31" fill="#F9D06B" stroke="#C98E22" stroke-width="4"/>
      <g fill="#FFF0C2" opacity="0.85">
        <ellipse cx="14" cy="-6" rx="10" ry="8"/>
        <ellipse cx="24" cy="12" rx="8" ry="6"/>
      </g>
      <g fill="#FFE3B4" opacity="0.6">
        <circle cx="-84" cy="4" r="4"/>
        <circle cx="-36" cy="-10" r="3.2"/>
        <circle cx="-8" cy="12" r="3"/>
      </g>
    </g>
    <g transform="translate(464 434) rotate(10) scale(0.74)">
      <rect x="-20" y="-31" width="176" height="62" rx="30" fill="url(#stickGrad2)" stroke="#5E2F0C" stroke-width="5"/>
      <ellipse cx="-6" cy="0" rx="27" ry="31" fill="#F9D06B" stroke="#C98E22" stroke-width="4"/>
      <g fill="#FFF0C2" opacity="0.85">
        <ellipse cx="-10" cy="-6" rx="10" ry="8"/>
        <ellipse cx="2" cy="12" rx="8" ry="6"/>
      </g>
      <g fill="#FFE3B4" opacity="0.6">
        <circle cx="46" cy="4" r="4"/>
        <circle cx="94" cy="-8" r="3.2"/>
        <circle cx="124" cy="10" r="3"/>
      </g>
    </g>
    <path d="M338 440C350 474 374 492 398 486C420 481 432 468 442 452" fill="none" stroke="url(#cheese)" stroke-width="24" stroke-linecap="round"/>
    <path d="M340 442C352 472 374 486 396 480" fill="none" stroke="#FFF6CE" stroke-width="8" stroke-linecap="round" opacity="0.75"/>
    <ellipse cx="386" cy="500" rx="12" ry="9" fill="#FFC93C"/>
    <ellipse cx="410" cy="494" rx="7" ry="5" fill="#F5A623"/>
  </g>

  <!-- Salsa marinara -->
  <g filter="url(#shadow)">
    <circle cx="626" cy="424" r="72" fill="#131313" stroke="#3A3A3A" stroke-width="5"/>
    <circle cx="626" cy="424" r="57" fill="url(#marinara)"/>
    <path d="M588 416c16-14 28 12 44 0s26 2 20 14" fill="none" stroke="#FF8A6E" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <ellipse cx="606" cy="404" rx="15" ry="7" fill="#FFFFFF" opacity="0.18"/>
    <g fill="#7E1310" opacity="0.5">
      <circle cx="644" cy="440" r="6"/>
      <circle cx="618" cy="440" r="4"/>
    </g>
  </g>

  <!-- Perejil -->
  <g fill="#6FA34B" stroke="#3F6627" stroke-width="2.5">
    <path d="M186 348c-14-10-10-28 4-32 12 8 10 24-4 32z"/>
    <path d="M206 358c18-6 30 6 24 20-14 6-26-2-24-20z"/>
    <path d="M192 372c-4 14-20 18-28 6 4-14 18-18 28-6z"/>
  </g>

  <path d="M566 122q30-40 70-34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <path d="M588 150q20-26 46-22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.11" stroke-linecap="round"/>
</svg>
