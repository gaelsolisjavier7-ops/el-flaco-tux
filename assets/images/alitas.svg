<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Alitas EL FLACO TUX</title>
  <desc id="d">Alitas de pollo glaseadas con salsa, servidas en tabla oscura.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#332016"/>
      <stop offset="55%" stop-color="#1A1210"/>
      <stop offset="100%" stop-color="#0B0B0B"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#FFC300" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="meat" x1="14%" y1="0%" x2="86%" y2="100%">
      <stop offset="0%" stop-color="#E08839"/>
      <stop offset="42%" stop-color="#B0521F"/>
      <stop offset="100%" stop-color="#6B2510"/>
    </linearGradient>
    <linearGradient id="meat2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#D87B31"/>
      <stop offset="45%" stop-color="#A44A1B"/>
      <stop offset="100%" stop-color="#601F0C"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="sauceYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFD54A"/>
      <stop offset="100%" stop-color="#F0A800"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="paper" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#151515"/>
      <rect width="28" height="28" fill="#1D1D1D"/>
      <rect x="28" y="28" width="28" height="28" fill="#1D1D1D"/>
    </pattern>

    <!-- Drumette: hueso hacia la izquierda, carne bulbosa -->
    <g id="drum">
      <g stroke="#C9AE87" stroke-width="3">
        <rect x="-178" y="-11" width="60" height="22" rx="11" fill="#F6E7CE"/>
        <circle cx="-182" cy="0" r="16" fill="#FBF0DE"/>
        <ellipse cx="-186" cy="-6" rx="7" ry="4.4" fill="#FFFFFF" opacity="0.7"/>
      </g>
      <path d="M-132-12C-124-54-82-76-26-76C32-76 82-50 90-2C98 44 62 72 8 74C-46 76-92 50-104 10C-108 0-120-6-132-12Z" fill="url(#meat)" stroke="#4A1707" stroke-width="5"/>
      <path d="M-98-30C-74-54-30-64 12-58" fill="none" stroke="#FFD9A6" stroke-width="10" stroke-linecap="round" opacity="0.42"/>
      <path d="M-88 42C-52 62 6 64 48 42" fill="none" stroke="#3A1006" stroke-width="7" stroke-linecap="round" opacity="0.3"/>
      <g fill="#FFE7C2" opacity="0.5">
        <ellipse cx="-30" cy="-22" rx="5" ry="3.4"/>
        <ellipse cx="18" cy="8" rx="4.6" ry="3"/>
        <ellipse cx="48" cy="-28" rx="4" ry="2.8"/>
        <ellipse cx="-52" cy="26" rx="4.2" ry="2.8"/>
      </g>
    </g>

    <!-- Wingette: dos huesos, carne alargada -->
    <g id="flat">
      <g stroke="#C9AE87" stroke-width="3" fill="#F6E7CE">
        <ellipse cx="-152" cy="-2" rx="15" ry="12"/>
        <ellipse cx="152" cy="-2" rx="15" ry="12"/>
      </g>
      <path d="M-142-28C-96-54-36-58 22-54C80-50 124-32 140-8C152 12 142 34 108 46C60 62-10 62-62 52C-112 42-148 22-152 2C-154-10-150-20-142-28Z" fill="url(#meat2)" stroke="#4A1707" stroke-width="5"/>
      <path d="M-106-32C-64-48-12-50 28-44" fill="none" stroke="#FFD9A6" stroke-width="9" stroke-linecap="round" opacity="0.38"/>
      <path d="M-96 40C-40 54 40 50 92 30" fill="none" stroke="#3A1006" stroke-width="6" stroke-linecap="round" opacity="0.26"/>
      <g fill="#FFE7C2" opacity="0.5">
        <ellipse cx="-52" cy="-16" rx="4.6" ry="3"/>
        <ellipse cx="0" cy="12" rx="4.2" ry="2.8"/>
        <ellipse cx="58" cy="-14" rx="4.4" ry="2.8"/>
        <ellipse cx="104" cy="10" rx="3.8" ry="2.4"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#paper)" opacity="0.28"/>
  <circle cx="400" cy="275" r="310" fill="url(#glow)"/>
  <ellipse cx="400" cy="505" rx="300" ry="42" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <ellipse cx="400" cy="315" rx="300" ry="190" fill="url(#plateGrad)" stroke="#343434" stroke-width="7"/>
  <ellipse cx="400" cy="312" rx="264" ry="158" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>

  <!-- Alitas: los huesos apuntan hacia afuera de la pila -->
  <g filter="url(#shadow)">
    <use href="#drum" transform="translate(338 246) rotate(-36) scale(0.80)"/>
    <use href="#drum" transform="translate(466 250) rotate(30) scale(0.80)"/>
    <use href="#flat" transform="translate(400 292) rotate(-5) scale(0.84)"/>
    <use href="#flat" transform="translate(342 352) rotate(-14) scale(0.74)"/>
    <use href="#flat" transform="translate(468 362) rotate(15) scale(0.74)"/>
  </g>

  <!-- Glaseado de salsa -->
  <g fill="none" stroke-linecap="round">
    <path d="M268 312C318 282 354 338 408 306S498 270 546 308" stroke="#3A1207" stroke-width="16" opacity="0.4"/>
    <path d="M268 308C318 278 354 334 408 302S498 266 546 304" stroke="url(#sauceYellow)" stroke-width="10"/>
    <path d="M300 352C346 326 380 374 432 346S508 330 534 352" stroke="#E63946" stroke-width="6" opacity="0.92"/>
    <path d="M316 258C358 236 394 264 436 244" stroke="#E63946" stroke-width="5" opacity="0.8"/>
  </g>

  <!-- Ajonjolí y migas -->
  <g fill="#FFF4D6">
    <ellipse cx="330" cy="300" rx="4.6" ry="2.8" transform="rotate(-20 330 300)"/>
    <ellipse cx="372" cy="336" rx="4.6" ry="2.8" transform="rotate(14 372 336)"/>
    <ellipse cx="446" cy="304" rx="4.6" ry="2.8" transform="rotate(-12 446 304)"/>
    <ellipse cx="486" cy="350" rx="4.4" ry="2.6" transform="rotate(25 486 350)"/>
    <ellipse cx="398" cy="376" rx="4" ry="2.4" transform="rotate(16 398 376)"/>
    <ellipse cx="418" cy="262" rx="4" ry="2.4" transform="rotate(-8 418 262)"/>
  </g>

  <g>
    <rect x="118" y="392" width="24" height="92" rx="12" transform="rotate(-28 130 438)" fill="#6FA34B" stroke="#3F6627" stroke-width="3"/>
    <rect x="150" y="402" width="24" height="86" rx="12" transform="rotate(-17 162 445)" fill="#7CB254" stroke="#3F6627" stroke-width="3"/>
    <rect x="184" y="410" width="23" height="78" rx="11" transform="rotate(-7 195 449)" fill="#6FA34B" stroke="#3F6627" stroke-width="3"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="626" cy="432" r="58" fill="#161616" stroke="#3A3A3A" stroke-width="4"/>
    <circle cx="626" cy="432" r="45" fill="#E63946"/>
    <path d="M596 432c16-16 34 14 52-2s28 2 20 12" fill="none" stroke="#FFC300" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <ellipse cx="610" cy="414" rx="12" ry="6" fill="#FFFFFF" opacity="0.2"/>
  </g>

  <path d="M552 138q28-38 68-34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.16" stroke-linecap="round"/>
  <path d="M574 164q20-24 46-22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.12" stroke-linecap="round"/>
</svg>
