<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Boneless EL FLACO TUX</title>
  <desc id="d">Trocitos de pechuga de pollo empanizados y bañados en salsa, servidos en charola con aderezo.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="74%">
      <stop offset="0%" stop-color="#32200F"/>
      <stop offset="55%" stop-color="#191210"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#FFC300" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#E63946" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nugGrad" x1="12%" y1="0%" x2="88%" y2="100%">
      <stop offset="0%" stop-color="#F3BC69"/>
      <stop offset="40%" stop-color="#D2872F"/>
      <stop offset="100%" stop-color="#8A4612"/>
    </linearGradient>
    <linearGradient id="nugGrad2" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#E9A64B"/>
      <stop offset="45%" stop-color="#B96A21"/>
      <stop offset="100%" stop-color="#743709"/>
    </linearGradient>
    <linearGradient id="trayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <linearGradient id="buffalo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7F53"/>
      <stop offset="55%" stop-color="#D8402A"/>
      <stop offset="100%" stop-color="#A31D18"/>
    </linearGradient>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F2E7D2"/>
      <stop offset="100%" stop-color="#D8C7A9"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <pattern id="paper" width="56" height="56" patternUnits="userSpaceOnUse">
      <rect width="56" height="56" fill="#151515"/>
      <rect width="28" height="28" fill="#1D1D1D"/>
      <rect x="28" y="28" width="28" height="28" fill="#1D1D1D"/>
    </pattern>

    <!-- Bocado empanizado: contorno irregular, no esférico -->
    <g id="nug">
      <path d="M-78 2C-82-14-70-28-54-26C-50-40-30-48-16-40C-8-50 12-50 20-40C36-44 52-32 50-18C64-12 66 6 54 14C54 30 36 40 22 34C10 44-10 44-20 34C-36 40-52 30-52 18C-66 16-74 10-78 2Z"
            fill="url(#nugGrad)" stroke="#5A2A0C" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-58-8C-42-24-12-30 10-24" fill="none" stroke="#FFDCA8" stroke-width="9" stroke-linecap="round" opacity="0.4"/>
      <path d="M-46 26C-24 36 4 34 22 24" fill="none" stroke="#5A2A0C" stroke-width="6" stroke-linecap="round" opacity="0.22"/>
      <g fill="#FFE6BC" opacity="0.65">
        <circle cx="-34" cy="2" r="3.4"/>
        <circle cx="-2" cy="-16" r="2.8"/>
        <circle cx="26" cy="4" r="3.2"/>
        <circle cx="-14" cy="18" r="2.6"/>
        <circle cx="44" cy="-14" r="2.4"/>
        <circle cx="-4" cy="30" r="2.2"/>
      </g>
    </g>

    <!-- Bocado bañado en salsa -->
    <g id="nugS">
      <path d="M-78 2C-82-14-70-28-54-26C-50-40-30-48-16-40C-8-50 12-50 20-40C36-44 52-32 50-18C64-12 66 6 54 14C54 30 36 40 22 34C10 44-10 44-20 34C-36 40-52 30-52 18C-66 16-74 10-78 2Z"
            fill="url(#nugGrad2)" stroke="#5A2A0C" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-66 0C-60-20-32-34-4-32C24-30 46-18 52-4C56 8 42 16 26 14C8 12-6 20-26 20C-46 20-64 12-66 0Z"
            fill="url(#buffalo)" opacity="0.8"/>
      <path d="M-44-14C-26-24 4-26 24-20" fill="none" stroke="#FFC0A6" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
      <g fill="#5A2A0C" opacity="0.35">
        <circle cx="-30" cy="8" r="2.6"/>
        <circle cx="12" cy="10" r="2.2"/>
      </g>
    </g>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#paper)" opacity="0.26"/>
  <circle cx="400" cy="270" r="320" fill="url(#glow)"/>
  <ellipse cx="400" cy="512" rx="310" ry="44" fill="#000000" opacity="0.55" filter="url(#soft)"/>

  <!-- Charola -->
  <g filter="url(#shadow)">
    <rect x="118" y="188" width="564" height="300" rx="40" fill="url(#trayGrad)" stroke="#3A3A3A" stroke-width="6"/>
    <rect x="140" y="210" width="520" height="256" rx="28" fill="#0C0C0C" stroke="#2B2B2B" stroke-width="3"/>
  </g>

  <!-- Papel encerado -->
  <path d="M164 236 L636 236 L612 442 L188 442 Z" fill="url(#paperGrad)" opacity="0.96"/>
  <path d="M196 262 L604 262" stroke="#C9B893" stroke-width="2" opacity="0.6"/>
  <path d="M188 302 L612 302" stroke="#C9B893" stroke-width="2" opacity="0.45"/>

  <!-- Charco de salsa -->
  <ellipse cx="404" cy="404" rx="150" ry="26" fill="url(#buffalo)" opacity="0.28"/>

  <!-- Boneless -->
  <g filter="url(#shadow)">
    <use href="#nug" transform="translate(352 254) rotate(-18) scale(0.62)"/>
    <use href="#nugS" transform="translate(468 252) rotate(5) scale(0.60)"/>
    <use href="#nugS" transform="translate(272 326) rotate(-12) scale(0.80)"/>
    <use href="#nug" transform="translate(412 306) rotate(9) scale(0.84)"/>
    <use href="#nugS" transform="translate(548 338) rotate(17) scale(0.76)"/>
    <use href="#nug" transform="translate(262 414) rotate(7) scale(0.74)"/>
    <use href="#nugS" transform="translate(400 414) rotate(-6) scale(0.80)"/>
    <use href="#nug" transform="translate(534 422) rotate(13) scale(0.70)"/>
  </g>

  <!-- Hilos y gotas de salsa -->
  <g fill="none" stroke-linecap="round">
    <path d="M300 300C340 278 372 318 414 292S484 272 516 300" stroke="url(#buffalo)" stroke-width="9" opacity="0.9"/>
    <path d="M318 366C356 344 388 384 430 358S492 348 514 370" stroke="url(#buffalo)" stroke-width="7" opacity="0.85"/>
  </g>
  <g fill="#D8402A" opacity="0.9">
    <ellipse cx="356" cy="440" rx="7" ry="9"/>
    <ellipse cx="438" cy="446" rx="5" ry="7"/>
    <ellipse cx="470" cy="330" rx="4" ry="6"/>
  </g>

  <!-- Aderezo ranch -->
  <g>
    <ellipse cx="614" cy="424" rx="74" ry="70" fill="#0F0F0F" stroke="#3C3C3C" stroke-width="5"/>
    <ellipse cx="614" cy="418" rx="58" ry="54" fill="#F8F4E9"/>
    <path d="M576 412c14-14 30 12 46 0s26 0 22 12" fill="none" stroke="#E0D6BE" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="598" cy="400" rx="16" ry="7" fill="#FFFFFF" opacity="0.75"/>
    <g fill="#6FA34B" opacity="0.75">
      <circle cx="636" cy="408" r="3"/>
      <circle cx="626" cy="432" r="2.4"/>
      <circle cx="648" cy="420" r="2"/>
    </g>
  </g>

  <!-- Ramita de apio -->
  <g>
    <rect x="150" y="356" width="20" height="82" rx="10" transform="rotate(-30 160 397)" fill="#6FA34B" stroke="#3F6627" stroke-width="3"/>
    <rect x="176" y="366" width="19" height="76" rx="9" transform="rotate(-16 185 404)" fill="#7CB254" stroke="#3F6627" stroke-width="3"/>
  </g>

  <path d="M566 128q30-40 70-34" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
  <path d="M588 156q20-26 46-22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.11" stroke-linecap="round"/>
</svg>
