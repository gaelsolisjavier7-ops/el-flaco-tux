<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0D0F12">
  <title>404 | EL FLACO TUX</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="assets/images/el_flaco_tux_logo.svg">
  <style>
    :root {
      --bg: #0D0F12;
      --surface: #14161B;
      --primary: #E63946;
      --secondary: #FFC300;
      --text: #FFFFFF;
      --muted: #8E8E93;
      --mono: 'Fira Code', 'Courier New', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      background-image:
        linear-gradient(rgba(255, 255, 255, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .04) 1px, transparent 1px);
      background-size: 40px 40px;
      color: var(--text);
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .card {
      max-width: 520px;
      padding: 40px 32px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .55);
    }
    .logo { width: 96px; height: 96px; margin-bottom: 20px; }
    .prompt {
      font-family: var(--mono);
      font-size: .82rem;
      color: var(--muted);
      margin-bottom: 14px;
      word-break: break-word;
    }
    .prompt span { color: var(--secondary); }
    .code {
      font-family: var(--mono);
      font-size: clamp(3.4rem, 14vw, 5rem);
      font-weight: 700;
      line-height: 1;
      color: var(--primary);
      letter-spacing: -.02em;
    }
    h1 {
      font-size: 1.35rem;
      text-transform: uppercase;
      letter-spacing: .04em;
      margin: 14px 0 10px;
    }
    p { color: var(--muted); font-size: .95rem; line-height: 1.55; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 26px; }
    a {
      display: inline-block;
      padding: 13px 22px;
      border-radius: 4px;
      font-weight: 700;
      font-size: .85rem;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: .03em;
      transition: transform .15s ease, background .15s ease;
    }
    a.primary { background: var(--primary); color: #fff; }
    a.primary:hover { background: #F04B57; transform: translateY(-1px); }
    a.ghost { color: var(--secondary); border: 1px solid rgba(255, 195, 0, .45); }
    a.ghost:hover { background: rgba(255, 195, 0, .08); transform: translateY(-1px); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/images/el_flaco_tux_logo.png" alt="EL FLACO TUX">
    <p class="prompt">tux@el-flaco-tux:~$ <span>cat pedido.txt</span></p>
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>El archivo que buscas no está en el menú. Vuelve al inicio y arma tu pedido: hamburguesas a la plancha, alitas y jochos.</p>
    <div class="actions">
      <a class="primary" href="/">&gt; IR AL INICIO</a>
      <a class="ghost" href="/#menu">&gt; VER MENÚ</a>
    </div>
  </main>
</body>
</html>
